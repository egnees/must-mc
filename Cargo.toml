[package]
name = "must-mc"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Optimal dynamic partial-order reduction for message-passing concurrency (the Must algorithm, OOPSLA 2024)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/egnees/must-mc"
documentation = "https://docs.rs/must-mc"
readme = "README.md"
keywords = ["model-checking", "concurrency", "dpor", "message-passing", "verification"]
categories = ["concurrency", "development-tools::testing", "algorithms"]
exclude = ["PLAN.md", "CLAUDE.md", "/.github"]

# The published crate is `must-mc`, but it is imported as `must`.
[lib]
name = "must"

# The library has zero dependencies. `clap` and `mimalloc` are used only by the
# examples: `clap` parses their CLI flags, and `mimalloc` is a faster global allocator
# for the allocation-heavy search. Neither is compiled into the library.
[dev-dependencies]
clap = { version = "4", features = ["derive"] }
mimalloc = "0.1"
# The `extended` feature exposes mimalloc's runtime options, letting the Raft example
# request large OS pages on Linux.
libmimalloc-sys = { version = "0.1", features = ["extended"] }

# The search is allocation- and branch-heavy, so thin LTO and a single codegen unit
# give a measurable speedup for the examples and `cargo test --release`.
[profile.release]
lto = "thin"
codegen-units = 1
